name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # pytest is the only third-party dependency; the vendored runtime itself
      # is standard-library only (see NOTICE.md).
      - run: pip install pytest
      - run: pytest tests/ -v

  drift:
    name: generated-file drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # quick-rules.md and diagnosis-rules.md are BUILT from ai-tell-taxonomy.md
      # (the SSOT). Hand-editing them silently desyncs the runtime — these two
      # checks are what make that impossible to merge.
      - run: python3 scripts/build_quick_rules.py --check
      - run: python3 scripts/build_diagnosis_rules.py --check
      # The workflow catalog is executable config: check_phase.py judges phase
      # completion from it. A broken glob or dangling depends_on would silently
      # corrupt /help's verdicts — schema validation makes that unmergeable.
      - run: python3 scripts/check_phase.py --validate

  lint:
    name: skill/agent structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pre-existing failures are recorded in scripts/lint_baseline.json and are
      # tolerated; anything new fails the build. Fix an entry, then delete it
      # from the baseline — the linter reports stale entries.
      - run: python3 scripts/lint_skills.py skills/ agents/ --baseline

  policy:
    name: policy compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The completion axis (tests, phase checks) cannot see unsafe-success:
      # work that finished by breaking a rule records the same exit 0 as work
      # that finished properly. This gate is the policy axis — it runs its own
      # smoke test first, then judges the repo against its own conventions.
      - run: python3 scripts/verify_policy.py --self-test
      - run: python3 scripts/verify_policy.py --project-root .
      # The plugin's own routing is a JOIN of workflow-catalog.yaml (steps) and
      # agent-packs.yaml (staffing). One line in either file silently re-routes
      # every skill in that phase, and no other check would notice. The golden
      # trajectory makes that diff visible; --update re-records it deliberately.
      - run: python3 scripts/verify_trajectory.py
