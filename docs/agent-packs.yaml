# agent-packs.yaml — 도메인 팩 분류 매니페스트 (v0.4.0+)
#
# 단일 source-of-truth. 오케스트레이터(CLAUDE.md)와 detect-project-type.sh 가 참조.
# project_type 감지 결과에 따라 활성 팩만 라우팅 → 무관 에이전트가 컨텍스트를 오염시키지 않음.
#
# pack 값:
#   core    — 모든 프로젝트에서 항상 활성 (도메인 무관 범용 역할)
#   game    — game 프로젝트에서만 활성
#   product — web / mobile / service 프로젝트에서만 활성
#   writing — 한국어 텍스트 산출물이 있는 모든 프로젝트에서 활성 (도메인 무관)
#
# 하이브리드 에이전트는 core 에 두되, 게임/제품 양쪽 프레이밍을 모두 수행 (neutral_name 참고).
# neutral_name 은 "권장 호칭" 으로만 사용하고 파일명은 유지한다(무중단).
# 초안은 v0.5.0 에 파일명 정식 리네임을 예정했으나 그 슬롯은 Lesson Ledger 가
# 가져갔고 리네임은 아직 하지 않았다 — 호칭과 파일명이 갈린 상태가 현행이다.

version: "0.6.0"

# 활성 규칙: project_type → 활성 팩
# writing 은 전 타입에서 활성 — 게임의 패치노트·GDD·내러티브 텍스트에도,
# 제품의 릴리스 노트·랜딩 카피·기술 문서에도 똑같이 필요하다.
# core 에 병합하지 않은 이유는 한국어 전용이기 때문 — 영어 대응이 필요해지면
# 여기서 빼기만 하면 된다.
activation:
  game:    [core, game, writing]
  web:     [core, product, writing]
  mobile:  [core, product, writing]
  service: [core, product, writing]
  unknown: [core, game, product, writing]   # 감지 실패 시 전체 노출(안전 폴백)

# 스테이지별 에이전트 배정 — v0.6.3 에 CLAUDE.md 본문에서 이곳으로 이관.
#
# 이 표는 팀의 선택이다. 에이전트가 파일을 뒤져 알아낼 수 있는 정보가 아니라서
# 지우면 복원되지 않는다. 다만 CLAUDE.md 본문에 두면 매 세션 60줄을 태우면서
# 정작 중요한 지시(결정적 게이트·루트 힌트)의 밀도를 떨어뜨린다.
# 그래서 삭제가 아니라 이관했다 — 라우팅의 SoT 는 원래부터 이 파일이다.
#
# 워크플로 스텝과 스킬은 docs/workflow-catalog.yaml 이 SoT 다. 여기는 "누가" 만,
# 카탈로그는 "무엇을 어떤 순서로" 를 담는다. 둘을 겹쳐 적지 않는다.
#
#   primary — 그 스테이지의 산출물을 책임지는 역할
#   support — 필요할 때 부르는 역할 (기본 호출 대상 아님)
#
# ⚠ 키는 docs/workflow-catalog.yaml 의 phase id 와 **정확히 일치해야 한다.**
# check_phase.py 가 현재 phase 를 알려주면 그 이름으로 이 표를 찾는 구조라,
# 한쪽에만 있는 phase 가 생기면 조회가 조용히 실패한다. 초안에서 실제로 그랬다 —
# 5개 스테이지만 적어서 concept·systems-design·technical-setup·architecture 가
# 비어 있었다. phase 를 추가·개명할 때는 두 파일을 같이 고칠 것.
# tests/test_agent_packs_stages.py 가 이 정합을 강제한다.
stages:

  game:
    concept:
      primary: [game-designer, creative-director]
      support: [narrative-director, art-director, producer]
    systems-design:
      primary: [systems-designer, game-designer, economy-designer]
      support: [narrative-director, world-builder, technical-director]
    technical-setup:
      primary: [technical-director, lead-programmer, engine-programmer]
      support: [devops-engineer, tools-programmer]
    pre-production:
      primary: [game-designer, ux-designer, art-director, gameplay-programmer]
      support: [technical-artist, level-designer, world-builder, producer, economy-designer]
    production:
      primary: [gameplay-programmer, ui-programmer, ai-programmer, lead-programmer]
      support: [technical-artist, sound-designer, tools-programmer, engine-programmer, network-programmer]
    polish:
      primary: [qa-lead, qa-tester, performance-analyst]
      support: [accessibility-specialist, localization-lead, security-engineer]
    release:
      primary: [release-manager, devops-engineer, qa-lead, producer]
      support: []

  product:
    discovery:
      primary: [product-manager, ux-designer]
      support: [technical-director, art-director, growth-engineer]   # art-director ≈ design-lead
    architecture:
      primary: [technical-director, lead-programmer, backend-engineer]
      support: [devops-engineer, security-engineer, data-engineer]
    build:
      primary: [frontend-engineer, backend-engineer, mobile-engineer, lead-programmer]
      support: [data-engineer, ui-programmer, ux-designer, devops-engineer, ai-programmer]
    hardening:
      primary: [qa-lead, qa-tester, performance-analyst, security-engineer]
      support: [accessibility-specialist, localization-lead]
    ship:
      primary: [release-manager, devops-engineer, qa-lead, producer, technical-writer]
      support: []
    growth:
      primary: [growth-engineer, analytics-engineer, data-engineer, community-manager, product-manager]
      support: []   # community-manager ≈ marketing-lead

# 카탈로그에 대응 phase 가 없는 운영 국면. check_phase.py 는 이것을 반환하지 않으므로
# 위 표와 분리해 둔다 — 게임 라이브 서비스는 릴리스 이후 사람이 판단해 진입한다.
post_release:
  game:
    live-ops:
      primary: [live-ops-designer, analytics-engineer, community-manager, economy-designer]
      support: []
  product:
    # growth 는 카탈로그의 마지막 phase 라 릴리스 직후부터 돌지만, 운영이 안정 궤도에
    # 오른 뒤의 국면은 성격이 다르다 — 신규 기능이 아니라 이미 나간 것의 유지·개선.
    # growth-engineer 가 live-ops-designer 를 mirrors 하는데 갈 곳이 없어 비어 있었다.
    operations:
      primary: [growth-engineer, analytics-engineer, community-manager, product-manager]
      support: [data-engineer, backend-engineer, devops-engineer, security-engineer]

# 스테이지와 무관하게 언제든 부를 수 있는 역할.
cross_stage:
  - name: creative-director
    role: 크리에이티브 비전, 부서 간 충돌 조정
  - name: technical-director
    role: 아키텍처, 기술 선택
  - name: producer
    role: 스프린트 계획, 마일스톤 추적, 리스크

packs:

  core:
    # --- 디렉터 ---
    - name: creative-director
      neutral_name: vision-lead
      role: 제품/창작 비전, 부서간 충돌 조정, 스코프 중재
    - name: technical-director
      role: 아키텍처 소유, 기술 평가, 성능 예산, 리스크
    - name: producer
      role: 스프린트 계획, 마일스톤 추적, 리스크, 부서 조율
    # --- 프로그래밍(범용) ---
    - name: lead-programmer
      role: 코드 아키텍처, 코드 리뷰, API 설계, 표준 강제
    - name: ui-programmer
      role: UI 시스템/화면/인터랙션 구현 (게임 HUD ~ 앱 화면)
    - name: ai-programmer
      role: 행동/추론 시스템, 의사결정 로직, LLM 통합
    - name: engine-programmer
      role: 코어 시스템, 렌더링/물리/메모리, 리소스 로딩
    - name: tools-programmer
      role: 에디터 확장, 콘텐츠 파이프라인 툴, 자동화
    - name: prototyper
      role: 빠른 컨셉 검증, vertical slice, 실험
    # --- QA/Ops(범용) ---
    - name: qa-lead
      role: 테스트 전략, 버그 트리아지, 품질 게이트, 릴리스 준비
    - name: qa-tester
      role: 테스트 케이스, 버그 리포트, 회귀 체크리스트
    - name: performance-analyst
      role: 프로파일링, 병목 식별, 최적화 권고
    - name: security-engineer
      role: 보안/프라이버시, 인증, 데이터 보호 (게임: anti-cheat)
    - name: accessibility-specialist
      role: 접근성 감사, WCAG, 보조 기능
    - name: localization-lead
      role: i18n 아키텍처, 문자열 관리, 번역 파이프라인
    - name: release-manager
      role: 릴리스 파이프라인, 버전, 인증/스토어 제출
    - name: devops-engineer
      role: 빌드 파이프라인, CI/CD, 배포 인프라
    - name: ux-designer
      role: 유저 플로우, 인터랙션 설계, 온보딩, 접근성
    - name: analytics-engineer
      role: 텔레메트리, 퍼널 분석, A/B, 대시보드
    - name: network-programmer
      role: 네트워킹, 상태 동기화 (게임: netcode / 서비스: 실시간)
    # --- 하이브리드(게임/제품 양용, core 배치) ---
    - name: art-director
      neutral_name: design-lead
      role: 비주얼 아이덴티티, 스타일 가이드 (게임 아트 ~ 웹 디자인 시스템)
    - name: narrative-director
      neutral_name: content-strategist
      role: 스토리/콘텐츠 전략, 메시징 아키텍처
    - name: community-manager
      neutral_name: marketing-lead
      role: 패치노트/릴리스 커뮤니케이션, 소셜, 유저 피드백, 위기 대응
    - name: writer
      neutral_name: content-writer
      role: 카피/문구/UX 라이팅 (게임 대사 ~ 제품 마이크로카피)

  game:
    - name: game-designer
      role: 메커닉 설계, 시스템 디자인, 밸런싱, 플레이어 경험
    - name: gameplay-programmer
      role: 게임 메커닉/플레이어 시스템/전투/인터랙션 구현 (제품 대응: frontend/backend-engineer)
    - name: systems-designer
      role: 메커닉 수식, 상호작용 매트릭스, 시뮬레이션 스펙
    - name: economy-designer
      role: 자원 흐름, 루트 테이블, 진행 곡선, 가상 경제
    - name: level-designer
      role: 공간 레이아웃, 인카운터, 페이싱, 환경 스토리텔링
    - name: world-builder
      role: 로어 정합성, 팩션, 타임라인, 지리/문화
    - name: live-ops-designer
      role: 시즌 이벤트, 배틀패스, 콘텐츠 케이던스, 리텐션 메커닉
    - name: technical-artist
      role: 셰이더, VFX, 렌더링 최적화, 아트 파이프라인
    - name: audio-director
      role: 사운드 아이덴티티, 음악 디렉션, 오디오 아키텍처
    - name: sound-designer
      role: SFX, 오디오 이벤트, 믹싱 파라미터

  product:
    - name: product-manager
      role: PRD, 로드맵, 우선순위, 지표 정의, 이해관계자 조율
      mirrors: [creative-director, producer]
    - name: frontend-engineer
      role: 웹 React/Next.js 구현, 상태관리, 반응형, Core Web Vitals
      mirrors: [ui-programmer]
    - name: backend-engineer
      role: REST/GraphQL API, DB 스키마, 인증/세션, 서버 검증, 확장성
      mirrors: [network-programmer]
    - name: mobile-engineer
      role: React Native/Expo, 네이티브 모듈, 스토어 빌드, 오프라인/배터리
    - name: data-engineer
      role: ETL, 데이터 웨어하우스, 이벤트 스키마, 데이터 품질
      mirrors: [analytics-engineer]
    - name: growth-engineer
      role: 전환 퍼널, 리텐션 루프, A/B, SEO, 획득 채널
      mirrors: [live-ops-designer]
    - name: technical-writer
      role: API 문서, 사용자 가이드, 런북
      mirrors: [writer]

  # 한국어 윤문 — 전 project_type 에서 활성. 출처: epoko77-ai/im-not-ai (MIT, NOTICE.md).
  # tools 를 좁게 선언해 "도구 호출 N회 캡"을 프롬프트가 아니라 스키마로 강제한다.
  writing:
    - name: humanize-monolith
      role: 단일 콜 한글 윤문 — 탐지·윤문·자체검증 일괄, 도구 호출 3회 캡
    - name: humanize-diagnostician
      role: 글 전체의 지배 AI 티 패턴 3~6개 진단 (standard·heavy 경로)
    - name: humanize-finalizer
      role: 원문 대조 의미 보존 15항 + 자연성 판정, 국소 보정 (heavy 경로)
    - name: korean-ai-tell-taxonomist
      role: AI 티 분류 체계 SSOT 유지·신규 패턴 승격 (유지보수 전용, 런타임 미호출)
